services:
  - type: web
    name: spider-tracking
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server.server:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --log-level info
    pythonVersion: "3.11"
    healthCheckPath: /api/health